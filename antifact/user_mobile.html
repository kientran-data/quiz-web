<!DOCTYPE html>

<html class="dark h-full" lang="en">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport" />
    <title>Quiz Question - Antigravity Engineering Training</title>
    <!-- Tailwind CSS v3 with Forms and Container Queries -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#eef2ff',
                            100: '#e0e7ff',
                            400: '#818cf8',
                            500: '#6366f1',
                            600: '#4f46e5',
                            700: '#4338ca',
                        },
                        surface: {
                            base: '#0f1117',
                            raised: '#181b24',
                            card: '#1e2230',
                            hover: '#262a3c',
                            border: '#2a2f42',
                            borderLight: '#383f58',
                        }
                    },
                    fontFamily: {
                        sans: ['-apple-system', 'BlinkMacSystemFont', '"SF Pro Display"', '"SF Pro Text"', 'Segoe UI', 'Roboto', 'sans-serif'],
                        mono: ['"SF Mono"', 'ui-monospace', 'Menlo', 'Monaco', 'monospace']
                    }
                }
            }
        };
    </script>
    <!-- Custom Styles for iOS Safe Areas & Precision Typography -->
    <style data-purpose="mobile-ios-adjustments">
        /* iOS safe area compatibility */
        .safe-top {
            padding-top: max(0.75rem, env(safe-area-inset-top));
        }

        .safe-bottom {
            padding-bottom: max(1rem, env(safe-area-inset-bottom));
        }

        /* Touch optimization */
        .touch-target {
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }
    </style>
</head>

<body
    class="bg-surface-base text-slate-100 font-sans min-h-full flex flex-col justify-between antialiased selection:bg-brand-500 selection:text-white">
    <!-- BEGIN: MainContainer -->
    <div
        class="w-full max-w-[420px] mx-auto min-h-screen flex flex-col justify-between bg-surface-base border-x border-surface-border/40 shadow-2xl relative">
        <!-- BEGIN: MobileTopHeader -->
        <header
            class="safe-top px-4 pt-3 pb-3 border-b border-surface-border/80 sticky top-0 z-30 bg-surface-base/95 backdrop-blur-md">
            <div class="flex items-center justify-between">
                <!-- Module badge -->
                <div class="flex items-center space-x-2">
                    <span
                        class="inline-flex items-center px-2 py-0.5 rounded text-[11px] font-semibold tracking-wide bg-brand-500/15 text-brand-400 border border-brand-500/25">
                        MODULE 02
                    </span>
                    <span class="text-xs text-slate-400 font-medium truncate max-w-[140px]">
                        Distributed Systems
                    </span>
                </div>
                <!-- Timer & Exit action -->
                <div class="flex items-center space-x-3">
                    <!-- Countdown indicator -->
                    <div class="flex items-center space-x-1.5 bg-surface-raised px-2.5 py-1 rounded-md border border-surface-border"
                        title="Time remaining">
                        <svg class="w-3.5 h-3.5 text-slate-400" fill="none" stroke="currentColor" viewbox="0 0 24 24">
                            <path d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" stroke-linecap="round"
                                stroke-linejoin="round" stroke-width="2"></path>
                        </svg>
                        <span class="text-xs font-mono font-medium text-slate-200 tracking-tight">18:42</span>
                    </div>
                    <!-- Exit / Close button -->
                    <button aria-label="Exit quiz"
                        class="touch-target text-slate-400 hover:text-white p-1 rounded-md transition-colors hover:bg-surface-card"
                        type="button">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewbox="0 0 24 24">
                            <path d="M6 18L18 6M6 6l12 12" stroke-linecap="round" stroke-linejoin="round"
                                stroke-width="2"></path>
                        </svg>
                    </button>
                </div>
            </div>
        </header>
        <!-- END: MobileTopHeader -->
        <!-- BEGIN: MainContent -->
        <main class="flex-1 px-4 py-5 space-y-6">
            <!-- BEGIN: ProgressSection -->
            <section class="space-y-2" data-purpose="quiz-progress">
                <div class="flex items-center justify-between text-xs">
                    <div class="flex items-center space-x-2">
                        <span class="text-[10px] uppercase font-bold tracking-widest text-slate-400">Question 3 of
                            10</span>
                    </div>
                    <span
                        class="text-[10px] font-mono uppercase px-2 py-0.5 rounded bg-surface-raised text-slate-300 border border-surface-border font-medium">
                        SYSTEM DESIGN
                    </span>
                </div>
                <!-- Linear visual progress bar (30% completed) -->
                <div class="w-full h-1.5 bg-surface-card rounded-full overflow-hidden">
                    <div class="bg-brand-500 h-full rounded-full transition-all duration-300" style="width: 30%;"></div>
                </div>
            </section>
            <!-- END: ProgressSection -->
            <!-- BEGIN: QuestionContent -->
            <section class="space-y-3" data-purpose="question-details">
                <!-- Question heading -->
                <h1 class="text-lg font-semibold tracking-tight text-white leading-snug">
                    In Raft consensus, what ensures a newly elected leader has all committed logs?
                </h1>
                <!-- Contextual Note / Protocol Invariant -->
                <div
                    class="flex items-start space-x-2.5 p-3 rounded-lg bg-surface-raised border border-surface-border/90 text-xs text-slate-300">
                    <svg class="w-4 h-4 text-brand-400 shrink-0 mt-0.5" fill="none" stroke="currentColor"
                        viewbox="0 0 24 24">
                        <path d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" stroke-linecap="round"
                            stroke-linejoin="round" stroke-width="2"></path>
                    </svg>
                    <div class="leading-relaxed">
                        <span class="font-semibold text-slate-200">Protocol invariant:</span> Candidate must receive
                        majority votes from peers who refuse if candidate's log is less up-to-date.
                    </div>
                </div>
            </section>
            <!-- END: QuestionContent -->
            <!-- BEGIN: AnswerOptions -->
            <section class="space-y-3" data-purpose="answer-choices">
                <fieldset class="space-y-2.5">
                    <legend class="sr-only">Choose one answer</legend>
                    <!-- Option A: Standard Default Card -->
                    <label
                        class="touch-target group relative flex items-center p-3.5 rounded-xl border border-surface-border bg-surface-card hover:bg-surface-hover active:scale-[0.99] transition-all cursor-pointer min-h-[56px]">
                        <input class="sr-only" name="raft_question" type="radio" value="A" />
                        <!-- Label Badge (A) -->
                        <span
                            class="w-7 h-7 flex items-center justify-center rounded-lg bg-surface-raised border border-surface-border text-xs font-semibold text-slate-300 mr-3 shrink-0 group-hover:border-slate-500 transition-colors">
                            A
                        </span>
                        <!-- Text Content -->
                        <div class="text-xs text-slate-200 leading-normal flex-1">
                            Followers push their uncommitted state to the leader immediately upon transition
                        </div>
                        <!-- Unchecked state ring -->
                        <div class="w-4 h-4 rounded-full border border-slate-600 ml-2 shrink-0"></div>
                    </label>
                    <!-- Option B: Standard Default Card -->
                    <label
                        class="touch-target group relative flex items-center p-3.5 rounded-xl border border-surface-border bg-surface-card hover:bg-surface-hover active:scale-[0.99] transition-all cursor-pointer min-h-[56px]">
                        <input class="sr-only" name="raft_question" type="radio" value="B" />
                        <!-- Label Badge (B) -->
                        <span
                            class="w-7 h-7 flex items-center justify-center rounded-lg bg-surface-raised border border-surface-border text-xs font-semibold text-slate-300 mr-3 shrink-0 group-hover:border-slate-500 transition-colors">
                            B
                        </span>
                        <!-- Text Content -->
                        <div class="text-xs text-slate-200 leading-normal flex-1">
                            Periodic synchronization with an external persistent coordinator engine
                        </div>
                        <!-- Unchecked state ring -->
                        <div class="w-4 h-4 rounded-full border border-slate-600 ml-2 shrink-0"></div>
                    </label>
                    <!-- Option C: Selected Card State -->
                    <label
                        class="touch-target relative flex items-center p-3.5 rounded-xl border-2 border-brand-500 bg-brand-500/10 shadow-[0_0_15px_rgba(99,102,241,0.12)] active:scale-[0.99] transition-all cursor-pointer min-h-[56px]">
                        <input checked="" class="sr-only" name="raft_question" type="radio" value="C" />
                        <!-- Selected Label Badge (C) -->
                        <span
                            class="w-7 h-7 flex items-center justify-center rounded-lg bg-brand-500 text-xs font-bold text-white mr-3 shrink-0 shadow-sm">
                            C
                        </span>
                        <!-- Selected Text Content -->
                        <div class="text-xs font-medium text-white leading-normal flex-1">
                            Election restriction voting rule rejecting candidates with logs less up-to-date
                        </div>
                        <!-- Checked circle icon indicator -->
                        <div
                            class="w-5 h-5 rounded-full bg-brand-500 flex items-center justify-center ml-2 shrink-0 shadow-sm">
                            <svg class="w-3.5 h-3.5 text-white" fill="none" stroke="currentColor" viewbox="0 0 24 24">
                                <path d="M5 13l4 4L19 7" stroke-linecap="round" stroke-linejoin="round"
                                    stroke-width="2.5"></path>
                            </svg>
                        </div>
                    </label>
                    <!-- Option D: Standard Default Card -->
                    <label
                        class="touch-target group relative flex items-center p-3.5 rounded-xl border border-surface-border bg-surface-card hover:bg-surface-hover active:scale-[0.99] transition-all cursor-pointer min-h-[56px]">
                        <input class="sr-only" name="raft_question" type="radio" value="D" />
                        <!-- Label Badge (D) -->
                        <span
                            class="w-7 h-7 flex items-center justify-center rounded-lg bg-surface-raised border border-surface-border text-xs font-semibold text-slate-300 mr-3 shrink-0 group-hover:border-slate-500 transition-colors">
                            D
                        </span>
                        <!-- Text Content -->
                        <div class="text-xs text-slate-200 leading-normal flex-1">
                            All logs are rewritten from the previous leader's snapshot during election
                        </div>
                        <!-- Unchecked state ring -->
                        <div class="w-4 h-4 rounded-full border border-slate-600 ml-2 shrink-0"></div>
                    </label>
                </fieldset>
            </section>
            <!-- END: AnswerOptions -->
        </main>
        <!-- END: MainContent -->
        <!-- BEGIN: BottomNavigation -->
        <footer
            class="safe-bottom sticky bottom-0 z-30 p-4 bg-surface-base/95 backdrop-blur-md border-t border-surface-border">
            <div class="flex items-center justify-between space-x-3">
                <!-- Previous Question Button -->
                <button
                    class="touch-target px-4 py-3 rounded-xl border border-surface-border bg-surface-card hover:bg-surface-hover active:bg-surface-raised text-xs font-semibold text-slate-300 transition-colors flex items-center space-x-1 min-h-[48px]"
                    type="button">
                    <svg class="w-4 h-4 text-slate-400" fill="none" stroke="currentColor" viewbox="0 0 24 24">
                        <path d="M15 19l-7-7 7-7" stroke-linecap="round" stroke-linejoin="round" stroke-width="2">
                        </path>
                    </svg>
                    <span>Previous</span>
                </button>
                <!-- Primary Next Question CTA -->
                <button
                    class="touch-target flex-1 py-3 px-5 rounded-xl bg-brand-600 hover:bg-brand-500 active:bg-brand-700 text-white font-medium text-xs tracking-wide shadow-lg shadow-brand-600/25 transition-all flex items-center justify-center space-x-2 min-h-[48px]"
                    type="button">
                    <span>Next Question</span>
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewbox="0 0 24 24">
                        <path d="M9 5l7 7-7 7" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
                    </svg>
                </button>
            </div>
        </footer>
        <!-- END: BottomNavigation -->
    </div>
    <!-- END: MainContainer -->
</body>

</html>
